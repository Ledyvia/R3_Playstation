<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.3 Playstation — Kelola Usaha Gaming</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f0f4ff;--surface:#e8edf8;--card:#fff;--border:#d0d8f0;
    --accent:#3d6bff;--accent2:#7c3aed;--green:#059669;--yellow:#d97706;
    --red:#e11d48;--text:#1e2a4a;--muted:#64748b;--glow:0 0 18px rgba(61,107,255,.2);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

  header{background:linear-gradient(135deg,#dde6ff,#e8edf8);border-bottom:1px solid var(--border);
    padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.35rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
  .logo span{font-weight:700;font-size:0.72rem;display:block;letter-spacing:4px;color:var(--muted);-webkit-text-fill-color:var(--muted);}
  .date-badge{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:8px 16px;font-size:0.82rem;color:var(--text);text-align:right;}
  .date-badge strong{color:var(--accent);display:block;font-size:1rem;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .save-label{font-size:0.72rem;color:var(--muted);display:flex;align-items:center;gap:2px;}

  /* SHIFT BAR */
  .shift-bar{padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--border);}
  .shift-bar.closed{background:#fff5f6;}
  .shift-bar.open{background:#f0fdf4;}
  .shift-status{font-size:0.82rem;font-weight:700;padding:5px 14px;border-radius:20px;}
  .shift-status.closed{background:#fee2e2;color:var(--red);}
  .shift-status.open{background:#dcfce7;color:var(--green);}
  .shift-info{font-size:0.8rem;color:var(--muted);flex:1;}
  .shift-info b{color:var(--text);}
  .btn-buka{background:linear-gradient(135deg,#059669,#22d3a0);color:#fff;border:none;
    border-radius:9px;padding:9px 20px;font-size:0.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:opacity .15s;}
  .btn-buka:hover{opacity:.88;}
  .btn-tutup{background:linear-gradient(135deg,#dc2626,#f87171);color:#fff;border:none;
    border-radius:9px;padding:9px 20px;font-size:0.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:opacity .15s;}
  .btn-tutup:hover{opacity:.88;}

  .tab-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 20px;overflow-x:auto;}
  .tab-btn{padding:12px 20px;font-size:0.83rem;font-weight:600;color:var(--muted);background:none;border:none;
    border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-btn:hover:not(.active){color:var(--text);}
  .tab-pane{display:none;}.tab-pane.active{display:block;}

  main{padding:24px 20px;max-width:1100px;margin:0 auto;}

  .closed-overlay{text-align:center;padding:60px 20px;color:var(--muted);}
  .closed-overlay .big-icon{font-size:4rem;display:block;margin-bottom:16px;}
  .closed-overlay h3{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--red);margin-bottom:8px;letter-spacing:2px;}
  .closed-overlay p{font-size:0.87rem;margin-bottom:24px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:transform .15s,box-shadow .15s;}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--glow);}
  .stat-card .icon{font-size:1.5rem;margin-bottom:5px;}
  .stat-card .label{font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px;}
  .stat-card .value{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:700;}
  .stat-card.blue .value{color:var(--accent);}
  .stat-card.green .value{color:var(--green);}
  .stat-card.purple .value{color:var(--accent2);}
  .stat-card.yellow .value{color:var(--yellow);}
  .stat-card.red .value{color:var(--red);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:20px;}
  .section-title{font-family:'Orbitron',sans-serif;font-size:0.8rem;letter-spacing:2.5px;
    color:var(--muted);text-transform:uppercase;margin-bottom:14px;padding-left:10px;border-left:3px solid var(--accent);}

  .form-control,.form-select{background:var(--surface);border:1px solid var(--border);
    color:var(--text);border-radius:8px;font-size:0.87rem;padding:8px 12px;}
  .form-control:focus,.form-select:focus{background:var(--surface);color:var(--text);
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,107,255,.15);}
  .form-control::placeholder{color:var(--muted);}
  label.small{font-size:0.73rem;color:var(--muted);display:block;margin-bottom:4px;}
  .input-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .input-row .form-group{flex:1;min-width:120px;}

  .unit-label{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:8px;width:36px;height:36px;display:flex;align-items:center;
    justify-content:center;font-family:'Orbitron',sans-serif;font-size:0.7rem;font-weight:700;color:#fff;}

  .btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
    border-radius:8px;padding:8px 16px;font-size:0.84rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .btn-accent:hover{opacity:.85;}
  .btn-green{background:linear-gradient(135deg,#16a07a,#22d3a0);color:#fff;border:none;
    border-radius:8px;padding:8px 16px;font-size:0.84rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .btn-green:hover{opacity:.85;}
  .btn-danger-sm{background:transparent;border:1px solid var(--red);color:var(--red);
    border-radius:6px;padding:4px 9px;font-size:0.75rem;cursor:pointer;transition:background .15s;}
  .btn-danger-sm:hover{background:rgba(225,29,72,.1);}
  .btn-yellow{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;border:none;
    border-radius:8px;padding:10px 20px;font-size:0.88rem;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:8px;transition:opacity .15s;}
  .btn-yellow:hover{opacity:.85;}
  .ctrl-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s;}
  .ctrl-btn:hover{border-color:var(--accent);}

  .ps-count-ctrl{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .ps-count-display{font-family:'Orbitron',sans-serif;font-size:1rem;color:var(--accent);min-width:28px;text-align:center;}

  .badge-cat{font-size:0.68rem;padding:2px 7px;border-radius:20px;font-weight:600;width:fit-content;}
  .badge-food{background:rgba(5,150,105,.12);color:var(--green);}
  .badge-drink{background:rgba(61,107,255,.12);color:#3d6bff;}

  .data-table{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:0.84rem;}
  .data-table th{font-size:0.69rem;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);padding:0 10px 6px;}
  .data-table td{padding:9px 10px;background:var(--surface);color:var(--text);}
  .data-table td:first-child{border-radius:8px 0 0 8px;}
  .data-table td:last-child{border-radius:0 8px 8px 0;}

  .total-bar{background:linear-gradient(135deg,#dde6ff,#ede9ff);border:1px solid var(--accent);
    border-radius:16px;padding:18px 22px;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;}
  .total-item .t-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);}
  .total-item .t-val{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;margin-top:3px;}

  .history-day{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .history-day-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;gap:10px;transition:background .15s;}
  .history-day-header:hover{background:rgba(61,107,255,.05);}
  .history-day-header .day-title{font-weight:600;font-size:0.9rem;}
  .history-day-header .day-meta{display:flex;gap:14px;flex-wrap:wrap;}
  .history-day-header .meta-pill{font-size:0.75rem;color:var(--muted);}
  .history-day-body{display:none;padding:0 18px 16px;border-top:1px solid var(--border);}
  .history-day-body.open{display:block;}

  .tv-btn{border:1.5px solid var(--border);background:var(--surface);border-radius:9px;
    padding:7px 14px;font-size:0.82rem;font-weight:700;cursor:pointer;
    transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;}
  .tv-btn .tv-num{font-family:'Orbitron',sans-serif;font-size:0.9rem;}
  .tv-btn .tv-status{font-size:0.62rem;}
  .tv-btn:hover:not(.tv-on){border-color:var(--accent);}
  .tv-btn.tv-on{border-color:var(--green);background:rgba(5,150,105,.08);color:var(--green);cursor:default;}

  .sess-section-hdr{font-size:0.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    padding:6px 0 4px;margin-bottom:4px;border-bottom:2px solid;display:flex;align-items:center;gap:6px;}
  .sess-section-hdr.active{color:var(--accent);border-color:rgba(61,107,255,.2);}
  .sess-section-hdr.done{color:var(--green);border-color:rgba(5,150,105,.2);}

  .sess-total-chip{display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,rgba(61,107,255,.06),rgba(124,58,237,.06));
    border:1px solid rgba(124,58,237,.15);border-radius:8px;padding:7px 12px;margin-top:10px;flex-wrap:wrap;}
  .sess-total-chip span{font-size:0.78rem;color:var(--muted);}
  .sess-total-chip b{font-family:'Orbitron',sans-serif;font-size:0.8rem;}
  .sess-badge{display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;font-weight:700;padding:3px 9px;border-radius:20px;}
  .sess-badge.done{background:rgba(5,150,105,.12);color:var(--green);border:1px solid rgba(5,150,105,.25);}
  .sess-badge.active{background:rgba(61,107,255,.12);color:var(--accent);border:1px solid rgba(61,107,255,.25);}
  .lock-icon{font-size:1.1rem;cursor:default;opacity:.55;user-select:none;}
  .sess-makmin-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px;}
  .sess-makmin-panel .sm-title{font-size:0.68rem;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .sess-makmin-menu{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .sm-menu-btn{background:var(--card);border:1px solid var(--border);border-radius:7px;
    padding:5px 10px;font-size:0.77rem;cursor:pointer;transition:border-color .12s;display:flex;flex-direction:column;gap:2px;}
  .sm-menu-btn:hover{border-color:var(--accent2);}
  .sm-menu-btn .sm-price{font-family:'Orbitron',sans-serif;font-size:0.68rem;color:var(--yellow);}
  .sess-tx-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
  .sess-tx-row:last-child{border-bottom:none;}
  .sess-tx-name{flex:1;}
  .sess-tx-total{font-family:'Orbitron',sans-serif;font-size:0.77rem;color:var(--yellow);min-width:60px;text-align:right;}
  .time-readonly{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:0.87rem;color:var(--muted);}

  /* PIN LOCK */
  #pinOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#0b0e1a,#1b2038);
    display:flex;align-items:center;justify-content:center;z-index:99999;flex-direction:column;gap:0;}
  .pin-box{background:#fff;border-radius:20px;padding:36px 32px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .pin-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.1rem;
    background:linear-gradient(90deg,#3d6bff,#7c3aed);-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;margin-bottom:4px;}
  .pin-sub{font-size:0.72rem;color:#64748b;letter-spacing:3px;margin-bottom:24px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #d0d8f0;background:transparent;transition:all .15s;}
  .pin-dot.filled{background:linear-gradient(135deg,#3d6bff,#7c3aed);border-color:#3d6bff;}
  .pin-dot.error{background:#e11d48;border-color:#e11d48;}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .pin-key{background:#f0f4ff;border:1px solid #d0d8f0;border-radius:12px;padding:14px;
    font-size:1.2rem;font-weight:700;cursor:pointer;transition:all .12s;color:#1e2a4a;font-family:'Orbitron',sans-serif;}
  .pin-key:hover{background:#dde6ff;border-color:#3d6bff;}
  .pin-key:active{transform:scale(.93);}
  .pin-key.del{font-size:1rem;color:#64748b;}
  .pin-err{color:#e11d48;font-size:0.78rem;min-height:18px;margin-bottom:6px;}
  .pin-lock{color:#d97706;font-size:0.78rem;}
  .pin-change-btn{font-size:0.75rem;color:#3d6bff;background:none;border:none;cursor:pointer;margin-top:8px;text-decoration:underline;}

  /* Notif bar perangkat lain */
  .rt-toast{position:fixed;bottom:20px;right:20px;background:#1e2a4a;color:#fff;
    border-radius:10px;padding:10px 18px;font-size:0.82rem;z-index:9999;
    opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;gap:8px;}
  .rt-toast.show{opacity:1;}

  .divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .empty-state{text-align:center;padding:28px;color:var(--muted);font-size:0.88rem;}
  .empty-state .big{font-size:1.8rem;display:block;margin-bottom:8px;}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:var(--surface);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  @media(max-width:600px){
    body{overflow-x:hidden;}
    header{padding:8px 10px;}
    .logo{font-size:0.8rem;}
    .logo span{font-size:0.55rem;letter-spacing:1px;}
    .date-badge{padding:4px 8px;font-size:0.65rem;}
    .date-badge strong{font-size:0.75rem;}
    .save-label{font-size:0.6rem;white-space:nowrap;}
    .stat-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .stat-card{padding:10px 12px;}
    .stat-card .value{font-size:0.9rem;}
    .panel{padding:12px 10px;}
    main{padding:12px 10px;}
    .total-bar{grid-template-columns:1fr 1fr;gap:8px;padding:12px;}
    .input-row{flex-direction:column;}
    .input-row .form-group{min-width:unset;width:100%;}
    .shift-bar{padding:10px 14px;gap:8px;}
  }
</style>
</head>
<body>

<!-- PIN OVERLAY -->
<div id="pinOverlay">
  <div class="pin-box">
    <div class="pin-logo">R.3 PLAYSTATION</div>
    <div class="pin-sub">KELOLA USAHA GAMING</div>
    <div class="pin-dots" id="pinDots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-err" id="pinErr"></div>
    <div class="pin-grid">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key" onclick="pinPress('0')" style="grid-column:2">0</button>
      <button class="pin-key del" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-lock" id="pinLock"></div>
    <button class="pin-change-btn" onclick="showChangePin()">🔑 Ganti PIN</button>
  </div>
</div>

<!-- Toast notif -->
<div class="rt-toast" id="rtToast">📡 <span id="rtToastMsg">Diperbarui dari perangkat lain</span></div>

<header>
  <div><div class="logo">R.3 PLAYSTATION <span>KELOLA USAHA GAMING</span></div></div>
  <div style="display:flex;align-items:center;gap:14px">
    <div class="save-label"><span class="save-dot"></span><span id="syncLabel">Memuat...</span></div>
    <div class="date-badge"><strong id="hariIni">—</strong><span id="tanggalIni">—</span></div>
  </div>
</header>

<!-- SHIFT BAR -->
<div class="shift-bar closed" id="shiftBar">
  <span class="shift-status closed" id="shiftStatus">🔴 TUTUP</span>
  <div class="shift-info" id="shiftInfo">Tekan <b>Buka</b> untuk memulai operasional hari ini.</div>
  <div id="shiftBtnWrap" style="flex-shrink:0"></div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('hari-ini')">🎮 Hari Ini</button>
  <button class="tab-btn" onclick="switchTab('riwayat')">📅 Riwayat</button>
  <button class="tab-btn" onclick="switchTab('menu-mgr')">🍜 Kelola Menu</button>
</div>

<main>
  <div class="tab-pane active" id="tab-hari-ini"><div id="mainContent"></div></div>
  <div class="tab-pane" id="tab-riwayat">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div style="font-size:0.85rem;color:var(--muted)">Riwayat tersimpan &amp; tersinkron ke cloud.</div>
      <button class="btn-yellow" onclick="exportExcel('all')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Export Semua Riwayat
      </button>
    </div>
    <div id="historyList"></div>
  </div>
  <div class="tab-pane" id="tab-menu-mgr">
    <div class="panel">
      <div class="section-title">➕ Tambah Menu Baru</div>
      <div class="input-row">
        <div class="form-group"><label class="small">Nama Item</label>
          <input type="text" class="form-control" id="newMenuName" placeholder="cth: Mie Goreng"></div>
        <div class="form-group" style="max-width:130px"><label class="small">Harga (Rp)</label>
          <input type="number" class="form-control" id="newMenuPrice" placeholder="5000"></div>
        <div class="form-group" style="max-width:120px"><label class="small">Kategori</label>
          <select class="form-select" id="newMenuCat">
            <option value="makanan">🍜 Makanan</option>
            <option value="minuman">🥤 Minuman</option>
          </select></div>
        <div><button class="btn-accent" onclick="addMenuItem()">＋ Tambah</button></div>
      </div>
    </div>
    <div class="panel">
      <div class="section-title">📋 Daftar Menu</div>
      <div id="menuMgrList"></div>
    </div>
  </div>
</main>

<!-- FIREBASE dengan onSnapshot -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import {
    getFirestore, doc, setDoc, getDoc, deleteDoc,
    collection, getDocs, onSnapshot
  } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const cfg = {
    apiKey:"AIzaSyBk81tPQk3uY0V8GPb67qUVw5q6BVEiZdM",
    authDomain:"r3-playstation.firebaseapp.com",
    projectId:"r3-playstation",
    storageBucket:"r3-playstation.firebasestorage.app",
    messagingSenderId:"157797053213",
    appId:"1:157797053213:web:7e8e29279333681475e7f4"
  };
  const app = initializeApp(cfg);
  const db  = getFirestore(app);

  // ── Simpan ──
  async function cloudSave(key, data) {
    try { await setDoc(doc(db,'r3ps',key), {payload: JSON.stringify(data)}); }
    catch(e) { console.warn('cloudSave failed:', e); }
  }
  // ── Ambil sekali ──
  async function cloudLoad(key) {
    try {
      const s = await getDoc(doc(db,'r3ps',key));
      if (s.exists()) return JSON.parse(s.data().payload);
    } catch(e) { console.warn('cloudLoad failed:', e); }
    return null;
  }
  // ── Hapus ──
  async function cloudDelete(key) {
    try { await deleteDoc(doc(db,'r3ps',key)); }
    catch(e) { console.warn('cloudDelete failed:', e); }
  }
  // ── Ambil semua key ──
  async function cloudLoadAllKeys() {
    try {
      const s = await getDocs(collection(db,'r3ps'));
      return s.docs.map(d => d.id);
    } catch(e) { return []; }
  }

  // ── Real-time listener ──
  const _unsubs = {};
  function cloudListen(key, cb) {
    if (_unsubs[key]) return;
    _unsubs[key] = onSnapshot(
      doc(db,'r3ps',key),
      snap => { if (snap.exists()) cb(JSON.parse(snap.data().payload)); },
      err  => console.warn('listener err:', err)
    );
  }
  function cloudUnlisten(key) {
    if (_unsubs[key]) { _unsubs[key](); delete _unsubs[key]; }
  }

  // Expose ke global
  window._db            = db;
  window._cloudSave     = cloudSave;
  window._cloudLoad     = cloudLoad;
  window._cloudDelete   = cloudDelete;
  window._cloudAllKeys  = cloudLoadAllKeys;
  window._cloudListen   = cloudListen;
  window._cloudUnlisten = cloudUnlisten;
  window._cloudReady    = true;

  setTimeout(() => { if (window._appInit) window._appInit(); }, 300);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
const PPH=5000, PPH2=3000;
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function rp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
function hm(m){return Math.floor(m/60)+'j '+((m%60)+'m');}
function calcDiff(s,e){
  if(!s||!e)return 0;
  const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  let d=(eh*60+em)-(sh*60+sm); return d<0?d+1440:d;
}
function calcEarning(mins){
  const fh=Math.floor(mins/60),rm=mins%60;
  let ex=0; if(rm>=46)ex=PPH; else if(rm>=16)ex=PPH2; else if(rm>=1)ex=1000;
  return fh*PPH+ex;
}
function nowStr(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function calKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtKey(k){const[y,m,d]=k.split('-');return DAYS[new Date(+y,+m-1,+d).getDay()]+', '+parseInt(d)+' '+MONTHS[+m-1]+' '+y;}
let _nid=Date.now(); function uid(){return 's'+(++_nid);}

// ══════════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════════
function loadMenu(){try{return JSON.parse(localStorage.getItem('r3ps_menu'))||defMenu();}catch{return defMenu();}}
function saveMenu(m){localStorage.setItem('r3ps_menu',JSON.stringify(m));if(window._cloudSave)window._cloudSave('menu',m);}
function defMenu(){return[
  {id:'m1',name:'Air Mineral',price:2000,category:'minuman'},
  {id:'m2',name:'Es Teh',price:3000,category:'minuman'},
  {id:'m3',name:'Mie Instan',price:4000,category:'makanan'},
  {id:'m4',name:'Keripik',price:3000,category:'makanan'},
];}

function emptyDay(){return{sessions:[],expenses:[],unitCount:4,shiftOpen:false,shiftOpenTime:null,shiftCloseTime:null,shiftOperDate:null};}
function loadDay(key){try{return JSON.parse(localStorage.getItem('r3ps_day_'+key))||emptyDay();}catch{return emptyDay();}}
function saveDay(key,data){
  localStorage.setItem('r3ps_day_'+key,JSON.stringify(data));
  if(window._cloudSave)window._cloudSave('day_'+key,data);
}

function loadShift(){try{return JSON.parse(localStorage.getItem('r3ps_shift'))||{active:false,operKey:null,openTime:null};}catch{return{active:false,operKey:null,openTime:null};}}
function saveShift(s){localStorage.setItem('r3ps_shift',JSON.stringify(s));if(window._cloudSave)window._cloudSave('shift',s);}

function allDayKeysLocal(){
  return Object.keys(localStorage).filter(k=>k.startsWith('r3ps_day_'))
    .map(k=>k.replace('r3ps_day_','')).sort().reverse();
}

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let menuItems   = loadMenu();
let shiftState  = loadShift();
let ACTIVE_KEY  = shiftState.active ? shiftState.operKey : calKey();
let dayData     = shiftState.active ? loadDay(ACTIVE_KEY) : emptyDay();

let _localWriting = false;
function persistDay(){
  _localWriting = true;
  saveDay(ACTIVE_KEY, dayData);
  setTimeout(()=>{ _localWriting = false; }, 2500);
}

function getSessions(){return dayData.sessions;}
function getExpenses(){return dayData.expenses;}
function getUnitCount(){return dayData.unitCount||4;}

// ══════════════════════════════════════════════════
//  CLOCK
// ══════════════════════════════════════════════════
function updateClock(){
  const now=new Date();
  document.getElementById('hariIni').textContent=DAYS[now.getDay()];
  document.getElementById('tanggalIni').textContent=
    now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear()+' • '+now.toLocaleTimeString('id-ID');
}
setInterval(updateClock,1000); updateClock();

// ══════════════════════════════════════════════════
//  TOAST NOTIF
// ══════════════════════════════════════════════════
let _toastTimer=null;
function showToast(msg){
  const t=document.getElementById('rtToast');
  document.getElementById('rtToastMsg').textContent=msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

// ══════════════════════════════════════════════════
//  REAL-TIME LISTENERS
// ══════════════════════════════════════════════════
function attachListeners(){
  if(!window._cloudListen) return;

  window._cloudListen('shift', incoming => {
    if(_localWriting) return;
    const prev = JSON.stringify(shiftState);
    const next = JSON.stringify(incoming);
    if(prev === next) return;

    shiftState = incoming;
    localStorage.setItem('r3ps_shift', JSON.stringify(incoming));

    if(incoming.active){
      ACTIVE_KEY = incoming.operKey;
      dayData    = loadDay(ACTIVE_KEY);
      attachDayListener(ACTIVE_KEY);
    } else {
      dayData    = emptyDay();
      ACTIVE_KEY = calKey();
    }

    if(!document.activeElement||document.activeElement.type!=='time'){
      renderShiftBar();
      renderMainContent();
      showToast('🔄 Status shift diperbarui dari perangkat lain');
    }
  });

  window._cloudListen('menu', incoming => {
    if(_localWriting) return;
    if(JSON.stringify(incoming)===JSON.stringify(menuItems)) return;
    menuItems = incoming;
    localStorage.setItem('r3ps_menu', JSON.stringify(incoming));
    renderMenuMgr();
    if(shiftState.active) renderPsSessions();
    showToast('🍜 Menu diperbarui dari perangkat lain');
  });

  if(shiftState.active) attachDayListener(ACTIVE_KEY);
}

function attachDayListener(key){
  if(!window._cloudListen) return;
  window._cloudListen('day_'+key, incoming => {
    if(_localWriting) return;
    if(JSON.stringify(incoming)===JSON.stringify(dayData)) return;

    dayData = mergeDay(dayData, incoming);
    localStorage.setItem('r3ps_day_'+key, JSON.stringify(dayData));

    if(!document.activeElement||document.activeElement.type!=='time'){
      renderPsSessions();
      renderExpenses();
      recalc();
      showToast('📡 Data diperbarui dari perangkat lain');
    }
  });
}

function mergeDay(local, remote){
  const out = Object.assign({}, remote);
  const sm = {};
  (local.sessions  || []).forEach(s => sm[s.id] = s);
  (remote.sessions || []).forEach(s => sm[s.id] = { ...sm[s.id], ...s });
  out.sessions = Object.values(sm).sort((a,b) => (a.inputOrder||0)-(b.inputOrder||0));
  const em = {};
  (local.expenses  || []).forEach(e => em[e.id] = e);
  (remote.expenses || []).forEach(e => em[e.id] = { ...em[e.id], ...e });
  out.expenses = Object.values(em);
  return out;
}

// ══════════════════════════════════════════════════
//  SHIFT — BUKA & TUTUP
// ══════════════════════════════════════════════════
function bukaOperasional(){
  if(shiftState.active){alert('Shift sudah terbuka!');return;}
  const operKey = calKey(), openTime = nowStr();
  shiftState = {active:true, operKey, openTime};
  saveShift(shiftState);
  ACTIVE_KEY = operKey;
  dayData    = loadDay(operKey);
  dayData.shiftOpen     = true;
  dayData.shiftOpenTime = openTime;
  dayData.shiftOperDate = operKey;
  persistDay();
  attachDayListener(ACTIVE_KEY);
  renderShiftBar();
  renderMainContent();
}

function tutupOperasional(){
  if(!shiftState.active){alert('Shift belum dibuka!');return;}
  const adaSesiAktif = getSessions().some(s=>!s.endTime);
  if(adaSesiAktif){
    if(!confirm('⚠️ Masih ada sesi PS yang belum diisi jam selesai!\n\nTetap tutup operasional?'))return;
  }
  const closeTime = nowStr();
  if(!confirm(`Tutup operasional sekarang (${closeTime})?\n\nData hari ini akan disimpan ke riwayat.\nFile Excel akan otomatis diunduh.`))return;

  dayData.shiftOpen      = false;
  dayData.shiftCloseTime = closeTime;
  persistDay();
  exportExcel('today');

  if(window._cloudUnlisten) window._cloudUnlisten('day_'+ACTIVE_KEY);

  shiftState = {active:false, operKey:null, openTime:null};
  saveShift(shiftState);
  dayData    = emptyDay();
  ACTIVE_KEY = calKey();

  renderShiftBar();
  renderMainContent();
  alert('✅ Operasional ditutup & data tersimpan!\nFile Excel sudah otomatis diunduh.');
}

function renderShiftBar(){
  const bar   = document.getElementById('shiftBar');
  const status= document.getElementById('shiftStatus');
  const info  = document.getElementById('shiftInfo');
  const wrap  = document.getElementById('shiftBtnWrap');
  if(shiftState.active){
    bar.className='shift-bar open';
    status.className='shift-status open'; status.textContent='🟢 BUKA';
    info.innerHTML=`Operasional dimulai: <b>${fmtKey(shiftState.operKey)}</b> jam <b>${shiftState.openTime}</b>`;
    wrap.innerHTML=`<button class="btn-tutup" onclick="tutupOperasional()">🔴 Tutup &amp; Simpan</button>`;
  } else {
    bar.className='shift-bar closed';
    status.className='shift-status closed'; status.textContent='🔴 TUTUP';
    info.innerHTML='Tekan <b>Buka</b> untuk memulai operasional hari ini.';
    wrap.innerHTML=`<button class="btn-buka" onclick="bukaOperasional()">🟢 Buka Sekarang</button>`;
  }
}

// ══════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════
function switchTab(name){
  ['hari-ini','riwayat','menu-mgr'].forEach((id,i)=>{
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active',id===name);
    document.getElementById('tab-'+id).classList.toggle('active',id===name);
  });
  if(name==='riwayat') renderHistory();

// ══════════════════════════════════════════════════
//  UNIT COUNT
// ══════════════════════════════════════════════════
function changeUnitCount(d){
  dayData.unitCount=Math.max(1,Math.min(10,getUnitCount()+d));
  document.getElementById('unitCountDisp').textContent=getUnitCount();
  persistDay(); renderTvSelector();

function renderTvSelector(){
  const wrap=document.getElementById('tvSelectorWrap'); if(!wrap)return;

    html+=`<button class="tv-btn${on?' tv-on':''}" ${on?'':'onclick="showTvForm('+i+')"'} id="tv-btn-${i}">
      <span class="tv-num">TV${i}</span><span class="tv-status">${on?'🟢 Main':'＋ Catat'}</span>
    </button>`;
  }
  html+='</div>';
  html+=`<div id="tvFormArea" style="display:none;margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px">

      <div><label class="small">Jam Mulai</label><input type="time" class="form-control" id="tvStartInput"></div>
      <div><label class="small">Jam Selesai <span style="color:var(--muted)">(opsional)</span></label><input type="time" class="form-control" id="tvEndInput"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-green" onclick="confirmAddSession()" style="padding:7px 16px;font-size:0.83rem">✔ Simpan Sesi</button>
      <button class="btn-danger-sm" onclick="hideTvForm()" style="padding:7px 12px">Batal</button>

let _pendingTv=null;
function showTvForm(n){
  _pendingTv=n;
  const area=document.getElementById('tvFormArea'); if(!area)return;
  const now=new Date(),h=now.getHours(),m=Math.floor(now.getMinutes()/5)*5;
  document.getElementById('tvStartInput').value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  document.getElementById('tvEndInput').value='';
  document.getElementById('tvFormTitle').textContent='📺 Input Sesi TV'+n;
  area.style.display='block';
  document.querySelectorAll('.tv-btn').forEach(b=>b.style.outline='none');
  const btn=document.getElementById('tv-btn-'+n); if(btn)btn.style.outline='2px solid var(--accent)';
}
function hideTvForm(){
  _pendingTv=null;
  const a=document.getElementById('tvFormArea'); if(a)a.style.display='none';
  document.querySelectorAll('.tv-btn').forEach(b=>b.style.outline='none');
}
function confirmAddSession(){
  const sv=document.getElementById('tvStartInput').value,ev=document.getElementById('tvEndInput').value;
  if(!sv){alert('Jam mulai wajib diisi!');return;}
  getSessions().push({id:uid(),startTime:sv,endTime:ev||'',sessionMakmin:[],tvNum:_pendingTv||null,inputOrder:Date.now()});
  persistDay(); hideTvForm(); renderPsSessions(); recalc();
}

// ══════════════════════════════════════════════════
//  SESSION STATUS  ← REVISI DI SINI
// ══════════════════════════════════════════════════
function getSessStatus(s){
  if(!s.startTime) return 'idle';
  if(s.endTime) return 'done';
  return 'playing';
}

function sessBadge(s){
  const st=getSessStatus(s);
  if(st==='done')    return`<span class="sess-badge done">✅ Selesai</span>`;
  if(st==='playing') return`<span class="sess-badge active">🟢 Sedang Main</span>`;
  return`<span class="sess-badge active">⏳ Belum Mulai</span>`;
}

// ══════════════════════════════════════════════════
//  SESSION HTML
// ══════════════════════════════════════════════════
function buildSessHTML(s){
  const mins=calcDiff(s.startTime,s.endTime), earn=calcEarning(mins);
  const isDone=getSessStatus(s)==='done';
  const sm=s.sessionMakmin||[], smT=sm.reduce((a,t)=>a+t.price*t.qty,0);
  const tvLabel=s.tvNum?`TV${s.tvNum}`:`TV-`;
  const menuBtns=!isDone?(menuItems.length
    ?menuItems.map(m=>`<button class="sm-menu-btn" onclick="addSessMakmin('${s.id}','${m.id}')">
        <span style="font-size:0.78rem;font-weight:600">${m.name}</span>
        <span class="badge-cat ${m.category==='makanan'?'badge-food':'badge-drink'}" style="font-size:0.63rem">${m.category==='makanan'?'🍜':'🥤'}</span>
        <span class="sm-price">${rp(m.price)}</span>
      </button>`).join('')
    :`<span style="color:var(--muted);font-size:0.78rem">Belum ada menu. Tambah di tab Menu.</span>`)
    :'';
  const txRows=sm.length
    ?sm.map(t=>`<div class="sess-tx-row">
        <span class="sess-tx-name">${t.menuName}</span>
        ${!isDone?`<div style="display:flex;align-items:center;gap:5px">
          <button class="ctrl-btn" style="width:20px;height:20px;font-size:0.8rem" onclick="changeSessMakminQty('${s.id}','${t.id}',-1)">−</button>

function addSessMakmin(sessId,menuId){
  const s=getSessions().find(x=>x.id===sessId),m=menuItems.find(x=>String(x.id)===String(menuId));
  if(!s||!m)return;
  if(!s.sessionMakmin)s.sessionMakmin=[];
  const ex=s.sessionMakmin.find(t=>String(t.menuId)===String(menuId));
  if(ex){ex.qty++;}
  else{const now=new Date();s.sessionMakmin.push({id:uid(),menuId:m.id,menuName:m.name,category:m.category,price:m.price,qty:1,time:now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});}
  persistDay();_refreshSessTx(s);recalc();
}
function removeSessMakmin(sessId,txId){
  const s=getSessions().find(x=>x.id===sessId); if(!s)return;
  s.sessionMakmin=(s.sessionMakmin||[]).filter(t=>t.id!==txId);
  persistDay();_refreshSessTx(s);recalc();
}
function changeSessMakminQty(sessId,txId,d){
  const s=getSessions().find(x=>x.id===sessId); if(!s)return;
  const t=(s.sessionMakmin||[]).find(x=>x.id===txId);
  if(t){t.qty=Math.max(1,t.qty+d);persistDay();_refreshSessTx(s);recalc();}
}
function _refreshSessTx(s){
  const sm=s.sessionMakmin||[],smT=sm.reduce((a,t)=>a+t.price*t.qty,0);
  const isDone=getSessStatus(s)==='done';
  const txEl=document.getElementById('sess-tx-'+s.id);
  if(txEl)txEl.innerHTML=sm.length
    ?sm.map(t=>`<div class="sess-tx-row">
        <span class="sess-tx-name">${t.menuName}</span>
        ${!isDone?`<div style="display:flex;align-items:center;gap:5px">
          <button class="ctrl-btn" style="width:20px;height:20px;font-size:0.8rem" onclick="changeSessMakminQty('${s.id}','${t.id}',-1)">−</button>
          <span style="font-family:'Orbitron',sans-serif;font-size:0.78rem">${t.qty}</span>
          <button class="ctrl-btn" style="width:20px;height:20px;font-size:0.8rem" onclick="changeSessMakminQty('${s.id}','${t.id}',1)">+</button>
        </div>`:`<span style="font-family:'Orbitron',sans-serif;font-size:0.78rem;color:var(--muted)">${t.qty}x</span>`}
        <span class="sess-tx-total">${rp(t.price*t.qty)}</span>
        ${!isDone?`<button class="btn-danger-sm" style="padding:2px 7px" onclick="removeSessMakmin('${s.id}','${t.id}')">✕</button>`:''}
      </div>`).join('')
    :`<div style="color:var(--muted);font-size:0.78rem;padding:4px 0">Belum ada pesanan</div>`;
  const chip=document.getElementById('sess-chip-'+s.id);
  if(chip){const earn=calcEarning(calcDiff(s.startTime,s.endTime));chip.innerHTML=`<span>💰 Main: <b style="color:var(--green)">${rp(earn)}</b></span><span>🍜 Makmin: <b style="color:var(--accent2)">${rp(smT)}</b></span><span>📋 Total Sesi: <b style="color:var(--yellow)">${rp(earn+smT)}</b></span>`;}
}

// ══════════════════════════════════════════════════
function calcDayTotals(data){
  const sess=data.sessions||[],exp=data.expenses||[];
  let mins=0,ps=0;
  sess.forEach(s=>{const m=calcDiff(s.startTime,s.endTime);mins+=m;ps+=calcEarning(m);});
  const mm=sess.flatMap(s=>s.sessionMakmin||[]).reduce((s,t)=>s+t.price*t.qty,0);
  const ex=exp.reduce((s,e)=>s+e.amount,0);
  return{totalMins:mins,totalPS:ps,totalMM:mm,totalExp:ex,totalPend:ps+mm,laba:ps+mm-ex};
}
function recalc(){
  const t=calcDayTotals(dayData),lc=t.laba>=0?'var(--green)':'var(--red)';
  ['statJam','statPS','statMM','statTotal','statExp'].forEach((id,i)=>{
    const e=document.getElementById(id);
    if(e)e.textContent=[hm(t.totalMins),rp(t.totalPS),rp(t.totalMM),rp(t.totalPend),rp(t.totalExp)][i];
  });
  ['tbJam','tbPS','tbMM','tbTotal','tbExp'].forEach((id,i)=>{
    const e=document.getElementById(id);
    if(e)e.textContent=[hm(t.totalMins),rp(t.totalPS),rp(t.totalMM),rp(t.totalPend),rp(t.totalExp)][i];
  });
  const la=document.getElementById('tbLaba'); if(la){la.textContent=rp(t.laba);la.style.color=lc;}
}

async function renderHistory(){
  const el=document.getElementById('historyList');
  el.innerHTML='<div class="empty-state" style="padding:16px">⏳ Memuat riwayat...</div>';

  if(window._cloudAllKeys){
    try{
      const cloudKeys=await window._cloudAllKeys();
      const cloudDayKeys=cloudKeys.filter(k=>k.startsWith('day_')).map(k=>k.replace('day_',''));

      allDayKeysLocal().forEach(k=>{
        if(!cloudDayKeys.includes(k) && !(shiftState.active && k===ACTIVE_KEY)){
          localStorage.removeItem('r3ps_day_'+k);
        }
      });

      for(const dk of cloudDayKeys){
        if(!localStorage.getItem('r3ps_day_'+dk)){
          const d=await window._cloudLoad('day_'+dk); if(d)localStorage.setItem('r3ps_day_'+dk,JSON.stringify(d));

    return`<div class="history-day">
      <div class="history-day-header" onclick="toggleHistory('${k}')">

async function exportExcel(mode){
  const wb=XLSX.utils.book_new();
  let keys;
  if(mode==='today'){
    keys=[ACTIVE_KEY];
  } else {
    if(window._cloudAllKeys){
      try{
        const ck=await window._cloudAllKeys();
        for(const k of ck){
          if(k.startsWith('day_')){
            const dk=k.replace('day_','');
            if(!localStorage.getItem('r3ps_day_'+dk)){
              const d=await window._cloudLoad(k); if(d)localStorage.setItem('r3ps_day_'+dk,JSON.stringify(d));
            }
          }
        }
      }catch(e){console.warn('export cloud fetch:',e);}
    }
    keys=allDayKeysLocal().slice().reverse();
  }

  keys.forEach(k=>{
    const d=loadDay(k),t=calcDayTotals(d),sess=d.sessions||[],exp=d.expenses||[];
    const tvNums=[...new Set(sess.map(s=>s.tvNum||'?'))].sort((a,b)=>String(a).localeCompare(String(b)));
    const rows=[['R.3 PLAYSTATION — LAPORAN HARIAN'],['Tanggal',fmtKey(k)],
      ['Jam Buka',d.shiftOpenTime||'—'],['Jam Tutup',d.shiftCloseTime||'(belum tutup)'],[]];
    tvNums.forEach(tv=>{
      const tvS=sess.filter(s=>(s.tvNum||'?')===tv);
      rows.push([`— TV${tv} —`],['Jam Mulai','Jam Selesai','Durasi','Bayar Main','Item Makmin','Qty','Harga Satuan','Subtotal Makmin','TOTAL SESI']);
      tvS.forEach(s=>{
        const mins=calcDiff(s.startTime,s.endTime),earn=calcEarning(mins);
        const sm=s.sessionMakmin||[],smT=sm.reduce((a,x)=>a+x.price*x.qty,0);
        if(!sm.length){rows.push([s.startTime,s.endTime||'—',hm(mins),earn,'—','','',0,earn]);}
        else sm.forEach((x,j)=>rows.push([j===0?s.startTime:'',j===0?(s.endTime||'—'):'',j===0?hm(mins):'',j===0?earn:'',x.menuName,x.qty,x.price,x.price*x.qty,j===0?earn+smT:'']));
      });
      const tvE=tvS.reduce((a,s)=>a+calcEarning(calcDiff(s.startTime,s.endTime)),0);
      const tvM=tvS.reduce((a,s)=>a+(s.sessionMakmin||[]).reduce((b,x)=>b+x.price*x.qty,0),0);
      rows.push(['','','Subtotal TV'+tv,tvE,'','','',tvM,tvE+tvM],[]);
    });
    rows.push(['— PENGELUARAN —'],['No','Keterangan','Jumlah']);
    exp.forEach((e,i)=>rows.push([i+1,e.desc,e.amount]));
    rows.push(['','TOTAL',t.totalExp],[]);
    rows.push(['— RINGKASAN —'],['Total Jam',hm(t.totalMins)],['Pend. PS',t.totalPS],
      ['Pend. Makmin',t.totalMM],['Total Pend.',t.totalPend],['Pengeluaran',t.totalExp],['LABA BERSIH',t.laba]);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:12},{wch:12},{wch:14},{wch:14},{wch:20},{wch:5},{wch:12},{wch:16},{wch:14}];
    XLSX.utils.book_append_sheet(wb,ws,k);
  });

  if(mode==='all'&&keys.length>1){
    const rows=[['R.3 PLAYSTATION — REKAP'],[],
      ['Tanggal','Hari','Jam Buka','Jam Tutup','Total Jam','Pend. PS','Pend. Makmin','Total Pend.','Pengeluaran','Laba'],
      ...keys.map(k=>{const d=loadDay(k),t=calcDayTotals(d);
        return[fmtKey(k),DAYS[new Date(...k.split('-').map((v,i)=>i===1?v-1:+v)).getDay()],
          d.shiftOpenTime||'—',d.shiftCloseTime||'—',hm(t.totalMins),t.totalPS,t.totalMM,t.totalPend,t.totalExp,t.laba];})];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:24},{wch:9},{wch:10},{wch:10},{wch:12},{wch:12},{wch:14},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws,'REKAP');
  }
  const now=new Date(),tgl=now.getDate()+'-'+(now.getMonth()+1)+'-'+now.getFullYear();
  XLSX.writeFile(wb,mode==='today'?`R3PS_${ACTIVE_KEY}.xlsx`:`R3PS_Semua_${tgl}.xlsx`);
}

// ══════════════════════════════════════════════════
//  SYNC LABEL
// ══════════════════════════════════════════════════
function setSyncLabel(txt,color){
  const el=document.getElementById('syncLabel'),dot=document.querySelector('.save-dot');
  if(el)el.textContent=txt; if(dot)dot.style.background=color;
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
renderShiftBar();
renderMainContent();
renderMenuMgr();

window._appInit = async function(){
  setSyncLabel('☁️ Sinkronisasi...','#d97706');
  try{
    const cm = await window._cloudLoad('menu');
    if(cm){menuItems=cm;localStorage.setItem('r3ps_menu',JSON.stringify(cm));}

    const cs = await window._cloudLoad('shift');
    if(cs && cs.active && !shiftState.active){
      shiftState=cs; localStorage.setItem('r3ps_shift',JSON.stringify(cs));
      ACTIVE_KEY=cs.operKey;
      dayData=loadDay(ACTIVE_KEY);
      const cd=await window._cloudLoad('day_'+ACTIVE_KEY);
      if(cd){dayData=cd;localStorage.setItem('r3ps_day_'+ACTIVE_KEY,JSON.stringify(cd));}
    } else if(shiftState.active){
      const cd=await window._cloudLoad('day_'+ACTIVE_KEY);
      if(cd){
        dayData=mergeDay(dayData,cd);
        localStorage.setItem('r3ps_day_'+ACTIVE_KEY,JSON.stringify(dayData));
      }
    }

    renderShiftBar();
    renderMainContent();
    renderMenuMgr();

    attachListeners();
    setSyncLabel('☁️ Real-time aktif','#059669');
  }catch(e){
    console.warn('init sync failed:',e);
    setSyncLabel('⚠️ Offline mode','#e11d48');
    attachListeners();
  }
};

setTimeout(()=>{ if(window._cloudReady) window._appInit(); }, 500);

// ══════════════════════════════════════════════════
//  PIN LOCK
// ══════════════════════════════════════════════════
const DEFAULT_PIN = '7120';
let _pinInput = '', _pinAttempts = 0, _pinLocked = false, _pinLockTimer = null;

function getPin(){ return localStorage.getItem('r3ps_pin') || DEFAULT_PIN; }
function savePin(p){ localStorage.setItem('r3ps_pin', p); if(window._cloudSave) window._cloudSave('pin', p); }

function pinPress(d){
  if(_pinLocked) return;
  const maxLen = getPin().length;
  if(_pinInput.length >= maxLen) return;
  _pinInput += d;
  updatePinDots();
  if(_pinInput.length === maxLen) setTimeout(checkPin, 120);
}
function pinDel(){
  if(_pinLocked) return;
  _pinInput = _pinInput.slice(0,-1);
  updatePinDots();
  document.getElementById('pinErr').textContent = '';
}
function updatePinDots(){
  const pin = getPin(), len = pin.length;
  const wrap = document.getElementById('pinDots');
  if(wrap.children.length !== len){
    wrap.innerHTML = Array.from({length:len},(_,i)=>`<div class="pin-dot" id="pd${i}"></div>`).join('');
  }
  for(let i=0;i<len;i++){
    const d = document.getElementById('pd'+i);
    if(d) d.classList.toggle('filled', i < _pinInput.length);
  }
}
function checkPin(){
  if(_pinInput === getPin()){
    document.getElementById('pinOverlay').style.display = 'none';
    _pinAttempts = 0;
    sessionStorage.setItem('r3ps_auth','1');
  } else {
    _pinAttempts++;
    _pinInput = '';
    updatePinDots();
    for(let i=0;i<getPin().length;i++){const d=document.getElementById('pd'+i);if(d){d.classList.add('error');setTimeout(()=>d.classList.remove('error'),500);}}
    if(_pinAttempts >= 3){
      _pinLocked = true;
      let sisa = 30;
      const lockEl = document.getElementById('pinLock');
      lockEl.textContent = `🔒 Terlalu banyak percobaan. Tunggu ${sisa}s`;
      _pinLockTimer = setInterval(()=>{
        sisa--;
        if(sisa <= 0){ clearInterval(_pinLockTimer); _pinLocked=false; _pinAttempts=0; lockEl.textContent=''; }
        else lockEl.textContent = `🔒 Tunggu ${sisa}s`;
      }, 1000);
      document.getElementById('pinErr').textContent = '';
    } else {
      document.getElementById('pinErr').textContent = `PIN salah! (${3-_pinAttempts}x lagi)`;
    }
  }
}
if(!sessionStorage.getItem('r3ps_auth')){
  document.getElementById('pinOverlay').style.display = 'flex';
} else {
  document.getElementById('pinOverlay').style.display = 'none';
}
document.addEventListener('keydown', e=>{
  if(document.getElementById('pinOverlay').style.display==='none') return;
  if(e.key>='0'&&e.key<='9') pinPress(e.key);
  else if(e.key==='Backspace') pinDel();
  else if(e.key==='Enter' && _pinInput.length===getPin().length) checkPin();
});

function showChangePin(){
  const old = prompt('Masukkan PIN lama:');
  if(old !== getPin()){ alert('PIN lama salah!'); return; }
  const n1 = prompt('Masukkan PIN baru (4-6 angka):');
  if(!n1||n1.length<4||n1.length>6||!/^\d+$/.test(n1)){ alert('PIN tidak valid!'); return; }
  const n2 = prompt('Konfirmasi PIN baru:');
  if(n1 !== n2){ alert('PIN tidak cocok!'); return; }
  savePin(n1);
  alert('✅ PIN berhasil diubah!');
}
